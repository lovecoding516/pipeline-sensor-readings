services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DJANGO_ENV: dev
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
